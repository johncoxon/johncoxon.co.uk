<html lang="en">
<head>
    <title>{{ site.title }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="apple-touch-icon" type="image/jpg" href="{{ '/images/apple-touch-icon.jpg' | relative_url }}"/>
    <link rel="shortcut icon" type="image/jpg" href="{{ '/images/apple-touch-icon.jpg' | relative_url }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    <noscript><link rel="stylesheet" href="{{ '/assets/css/noscript.css' | relative_url }}" /></noscript>
</head>
<body class="is-preload">
    <!-- Wrapper -->
    <div id="wrapper">
        <!-- Header -->
        <header id="header">
            <div class="logo">
                <span class="icon fa-satellite"></span>
            </div>
            <div class="content">
                <div class="inner">
                    <h1>{{ site.title }}</h1>
                    {% include subtitle.html %}
                </div>
            </div>
            <nav>
                <ul>
                    {%- assign articles = site.articles | sort: "order" -%}
                    {%- for article in articles %}
                    <li><a href="#{{ article.slug }}">{{ article.title }}</a></li>
                    {%- endfor %}
                </ul>
            </nav>
        </header>

        <!-- Main -->
        <div id="main">
            {{ content }}
        </div>

        <!-- Footer -->
        <footer id="footer">
            <p class="copyright">&copy; {{ site.author }} {{ site.time | date: "%Y" }}. Design: <a href="https://html5up.net">HTML5 UP</a>.</p>
        </footer>
    </div>

    <!-- Background -->
    <div id="bg"></div>

    <!-- Scripts -->
    <script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/util.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>
</html>
